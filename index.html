<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="منصة المزاد المفتوح للمزادات الحية والتجارة المباشرة">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="المزاد المفتوح">
  <meta name="theme-color" content="#0f172a">
  <meta name="msapplication-navbutton-color" content="#0f172a">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=20261102_0020">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=20261102_0020"/>

  <title>المزاد المفتوح | Open Mazad</title>
  <link rel="manifest" href="manifest.json?v=20261102_0020">

  <!-- Preconnect & DNS-Prefetch لتسريع الاتصال على الشبكات الضعيفة -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body, flutter-view, flt-glass-pane {
      background-color: #0f172a !important;
      background: #0f172a !important;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", "Tajawal", "Helvetica Neue", sans-serif;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 40%, #1e293b 0%, #0f172a 100%);
      z-index: 9999999;
      transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
      text-align: center;
      padding: 24px;
    }
    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .splash-logo-card {
      width: 130px;
      height: 130px;
      border-radius: 26px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      box-shadow: 0 16px 36px -6px rgba(0, 0, 0, 0.5), 0 0 30px rgba(220, 38, 38, 0.25);
      margin-bottom: 20px;
      animation: pulse-logo 2.4s infinite ease-in-out;
    }
    .splash-logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 18px;
      user-select: none;
    }
    .splash-title {
      font-size: 23px;
      font-weight: 800;
      color: #f8fafc;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }
    .splash-tagline {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 22px;
      font-weight: 400;
    }
    .splash-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #ef4444;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    .splash-progress-track {
      width: 220px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 12px;
      position: relative;
    }
    .splash-progress-bar {
      width: 8%;
      height: 100%;
      background: linear-gradient(90deg, #ef4444, #f59e0b, #10b981);
      border-radius: 4px;
      transition: width 0.4s ease;
    }
    .splash-status {
      font-size: 13px;
      color: #cbd5e1;
      font-weight: 500;
      max-width: 300px;
      line-height: 1.5;
    }
    .splash-substatus {
      font-size: 11.5px;
      color: #64748b;
      margin-top: 6px;
      max-width: 280px;
      line-height: 1.4;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse-logo {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
  </style>

</head>
<body>
  <!-- شاشة التحميل التمهيدية بالشعار الرسمي وشريط التقدم الذكي للشبكات البطيئة -->
  <div id="splash-screen">
    <div class="splash-logo-card">
      <img src="logo.png" alt="المزاد المفتوح | OpenMazad" class="splash-logo-img">
    </div>
    <h1 class="splash-title">المزاد المفتوح</h1>
    <p class="splash-tagline">منصة المزادات الحية والتجارة المباشرة</p>
    <div class="splash-spinner"></div>
    <div class="splash-progress-track">
      <div class="splash-progress-bar" id="splash-progress-bar"></div>
    </div>
    <div class="splash-status" id="splash-status-text">جاري بدء تشغيل المنصة...</div>
    <div class="splash-substatus" id="splash-substatus-text"></div>
  </div>

  <script>
    function hideSplashScreen() {
      var splash = document.getElementById('splash-screen');
      if (splash && !splash.classList.contains('fade-out')) {
        splash.classList.add('fade-out');
        setTimeout(function() {
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, 450);
      }
    }

    var progressBar = document.getElementById('splash-progress-bar');
    var statusText = document.getElementById('splash-status-text');
    var substatusText = document.getElementById('splash-substatus-text');
    var currentProgress = 12;

    // محاكي تقدّم مرئي ذكي للشبكات البطيئة يمنح المستخدم تأكيداً حركياً مستمراً
    var progressInterval = setInterval(function() {
      if (currentProgress < 92) {
        currentProgress += (92 - currentProgress) * 0.08;
        if (progressBar) progressBar.style.width = Math.min(currentProgress, 92) + '%';
      }
    }, 350);

    // تكييف الرسائل التوضيحية بحسب سرعة الاتصال
    setTimeout(function() {
      if (statusText) statusText.textContent = "جاري تنزيل ملفات المنصة... ⚡";
    }, 2200);

    setTimeout(function() {
      if (statusText) statusText.textContent = "جاري ضغط البيانات وتجهيز الواجهة... 📶";
      if (substatusText) substatusText.textContent = "اتصال الإنترنت ضعيف، يُرجى الانتظار ثوانٍ معدودة";
    }, 5000);

    setTimeout(function() {
      if (statusText) statusText.textContent = "أوشك التحميل على الاكتمال... 🚀";
      if (substatusText) substatusText.textContent = "";
    }, 9000);

    // الاستماع لحدث اكتمال أول إطار في Flutter Web
    window.addEventListener('flutter-first-frame', function() {
      clearInterval(progressInterval);
      if (progressBar) progressBar.style.width = '100%';
      setTimeout(hideSplashScreen, 150);
    });

    // مراقبة ظهور عناصر الرسم في DOM لإخفاء الشاشة فور ظهور الواجهة
    var observer = new MutationObserver(function(mutations, obs) {
      var flt = document.querySelector('flutter-view, flt-glass-pane, canvas');
      if (flt) {
        clearInterval(progressInterval);
        if (progressBar) progressBar.style.width = '100%';
        setTimeout(hideSplashScreen, 250);
        obs.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // مؤقت أمان كحد أقصى (30 ثانية في أسوأ حالات انقطاع الشبكة)
    setTimeout(function() {
      hideSplashScreen();
    }, 30000);
  </script>

  <script src="flutter_bootstrap.js?v=20261102_1407" async></script>
</body>
</html>
