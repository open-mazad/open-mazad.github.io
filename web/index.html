<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="منصة المزاد المفتوح للمزادات الحية والتجارة المباشرة">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="المزاد المفتوح">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>المزاد المفتوح | Open Mazad</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", "Tajawal", "Helvetica Neue", sans-serif;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 40%, #1e293b 0%, #0f172a 100%);
      z-index: 9999999;
      transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
      text-align: center;
      padding: 24px;
    }
    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .splash-logo-card {
      width: 140px;
      height: 140px;
      border-radius: 28px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      box-shadow: 0 16px 36px -6px rgba(0, 0, 0, 0.5), 0 0 30px rgba(220, 38, 38, 0.25);
      margin-bottom: 24px;
      animation: pulse-logo 2.4s infinite ease-in-out;
    }
    .splash-logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 18px;
      user-select: none;
    }
    .splash-title {
      font-size: 24px;
      font-weight: 800;
      color: #f8fafc;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .splash-tagline {
      font-size: 13.5px;
      color: #94a3b8;
      margin-bottom: 28px;
      font-weight: 400;
    }
    .splash-spinner {
      width: 34px;
      height: 34px;
      border: 3.5px solid rgba(255, 255, 255, 0.1);
      border-top-color: #ef4444;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }
    .splash-status {
      font-size: 13px;
      color: #64748b;
      font-weight: 500;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse-logo {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
  </style>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var r of regs) { r.unregister(); }
      });
    }
  </script>
</head>
<body>
  <!-- شاشة التحميل التمهيدية بالشعار الرسمي للمنصة -->
  <div id="splash-screen">
    <div class="splash-logo-card">
      <img src="logo.png" alt="المزاد المفتوح | OpenMazad" class="splash-logo-img">
    </div>
    <h1 class="splash-title">المزاد المفتوح</h1>
    <p class="splash-tagline">منصة المزادات الحية والتجارة المباشرة</p>
    <div class="splash-spinner"></div>
    <div class="splash-status" id="splash-status-text">جاري تجهيز المنصة...</div>
  </div>

  <script>
    function hideSplashScreen() {
      var splash = document.getElementById('splash-screen');
      if (splash && !splash.classList.contains('fade-out')) {
        splash.classList.add('fade-out');
        setTimeout(function() {
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, 450);
      }
    }

    // الاستماع لحدث اكتمال أول إطار في Flutter Web
    window.addEventListener('flutter-first-frame', function() {
      hideSplashScreen();
    });

    // مراقبة ظهور عناصر الرسم في DOM لإخفاء الشاشة فور ظهور الواجهة
    var observer = new MutationObserver(function(mutations, obs) {
      var flt = document.querySelector('flutter-view, flt-glass-pane, canvas');
      if (flt) {
        setTimeout(hideSplashScreen, 300);
        obs.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // مؤقت أمان في حال تأخر الإشارة لأي سبب
    setTimeout(function() {
      hideSplashScreen();
    }, 4500);
  </script>

  <script src="flutter_bootstrap.js?v=20261031_1852" async></script>
</body>
</html>
